; Lens Slate: e-paper lens chart / crew list / notes for the LilyGo T5 4.7"
;
; Pick the environment that matches your board:
;   pio run -e T5-ePaper-S3 -t upload   (newer ESP32-S3 version, USB-C, one user button)
;   pio run -e T5-ePaper    -t upload   (older ESP32-WROVER version, three user buttons)

[platformio]
boards_dir = boards
default_envs = T5-ePaper-S3

[env]
platform = espressif32@6.12.0
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
board_build.filesystem = littlefs
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=0
lib_deps =
	https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#50224221fb81a8fcf9068532374b775af84a38d4
	bblanchon/ArduinoJson@7.4.2

[env:T5-ePaper-S3]
board = T5-ePaper-S3
build_flags = ${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLILYGO_T5_EPD47_S3

[env:T5-ePaper]
board = T5-ePaper
build_flags = ${env.build_flags}
	-DLILYGO_T5_EPD47
