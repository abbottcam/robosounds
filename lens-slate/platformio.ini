; Lens Slate: e-paper lens chart / crew list / notes
;
; Pick the environment that matches your board, then upload:
;   pio run -e T5-ePaper-S3-Pro -t upload       T5 4.7" S3 E-Paper Pro, revision H752-01 (current)
;   pio run -e T5-ePaper-S3-Pro-H752 -t upload  T5 4.7" S3 E-Paper Pro, older revision H752
;   pio run -e T5-ePaper-S3 -t upload           plain T5 4.7" board, ESP32-S3 version
;   pio run -e T5-ePaper -t upload              plain T5 4.7" board, original ESP32 version
; The revision (H752-01 or H752) is printed on the Pro's circuit board.

[platformio]
boards_dir = boards
default_envs = T5-ePaper-S3-Pro

[env]
platform = espressif32@6.12.0
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
board_build.filesystem = littlefs
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=0
lib_deps =
	bblanchon/ArduinoJson@7.4.2

; --- T5 4.7" S3 E-Paper Pro (case + built-in battery), FastEPD library -------

[pro]
board = T5-ePaper-S3-Pro
build_flags = ${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DSLATE_BOARD_T5PRO
lib_deps = ${env.lib_deps}
	https://github.com/bitbank2/FastEPD.git#2.2.0

[env:T5-ePaper-S3-Pro]
extends = pro

[env:T5-ePaper-S3-Pro-H752]
extends = pro
build_flags = ${pro.build_flags}
	-DSLATE_PRO_H752

; --- Plain T5 4.7" boards, LilyGo-EPD47 library --------------------------------

[t5]
lib_deps = ${env.lib_deps}
	https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#50224221fb81a8fcf9068532374b775af84a38d4

[env:T5-ePaper-S3]
board = T5-ePaper-S3
lib_deps = ${t5.lib_deps}
build_flags = ${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLILYGO_T5_EPD47_S3
	-DSLATE_BOARD_T5

[env:T5-ePaper]
board = T5-ePaper
lib_deps = ${t5.lib_deps}
build_flags = ${env.build_flags}
	-DLILYGO_T5_EPD47
	-DSLATE_BOARD_T5
